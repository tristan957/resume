# yaml-language-server: $schema=../schemas/projects.json

- name: Ghostty
  url: https://ghostty.org
  icon: ghost
  descriptors:
    - >
      Ghostty is a fast, feature-rich, and cross-platform terminal emulator that
      uses platform-native UI and GPU acceleration
    - >
      Part of the GTK maintainer team which facilitates delivering Ghostty on
      Linux

- name: Heterogeneous-Memory Storage Engine
  url: https://github.com/hse-project/hse
  icon: github
  descriptors:
    - >
      A fast embeddable key-value store designed for SSDs and persistent memory,
      optimizing performance and endurance by orchestrating data placement
      across DRAM and multiple classes of solid-state storage

- name: Various Open-Source Contributions
  descriptors:
    - >
      Authored over 100 commits to the Meson build system
    - >
      Contributed code to various projects within the GNOME community
    - >
      Added initial native file chooser support to Electron using the XDG
      Desktop Portal
    - >
      Participating in aerc (email client) development to facilitate
      contributing to Postgres
